name: CI

on:
  push:
    branches: [main, modernize-2026]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.11.28"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv tool run ruff@latest check --output-format=github .
      - run: uv tool run ruff@latest format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
      - working-directory: server
        run: uv run --extra dev mypy --strict src/fzip_server

  client-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
      # The crypto, archive and vault suites are pure Python. Installing PyQt6
      # and OpenCV here would add minutes for no coverage, so the GUI deps are
      # skipped and the modules under test import nothing from Qt.
      - working-directory: client
        run: |
          PYTHONPATH=src uv run --no-project --python 3.13 \
            --with cryptography --with argon2-cffi --with pytest --with pytest-cov \
            pytest tests -q --cov=src/fzip_client --cov-report=term-missing

  server-tests:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      FZIP_MONGO_URI: mongodb://localhost:27017
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
      # conftest.py generates the required secrets itself when they are absent,
      # so no CI secrets are needed for the test run.
      - working-directory: server
        run: uv run --extra dev pytest tests -q

  build-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: false
          load: true
          tags: fzip-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify the app imports and models are present
        run: |
          docker run --rm fzip-api:ci python -c "
          from pathlib import Path
          models = sorted(p.name for p in Path('/app/models').glob('*.onnx'))
          assert len(models) == 2, models
          print('models:', models)
          import cv2
          cv2.FaceDetectorYN.create(
              '/app/models/face_detection_yunet_2023mar.onnx', '', (320, 320))
          cv2.FaceRecognizerSF.create(
              '/app/models/face_recognition_sface_2021dec.onnx', '')
          print('both models load')
          "
      - name: Confirm the image does not run as root
        run: |
          test "$(docker run --rm fzip-api:ci id -u)" != "0"

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Scan history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true  # key.key is a known historical finding
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
      - name: Audit dependencies
        run: |
          uv tool run pip-audit --version
          for project in server client; do
            uv export --directory "$project" --no-hashes --format requirements-txt \
              > "/tmp/$project.txt"
            uv tool run pip-audit --requirement "/tmp/$project.txt" --strict || true
          done
