[project]
name = "fzip-server"
version = "2.0.0"
description = "FZIP Locker API - authentication and face verification"
requires-python = ">=3.13"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "motor>=3.6",
    "pymongo>=4.9",
    # Argon2id password hashing. Replaces the 2022 scheme, which encrypted
    # passwords reversibly under a key derived from a plaintext field stored
    # in the same document.
    "argon2-cffi>=23.1",
    # EdDSA (Ed25519) token signing, plus AES-GCM for biometric templates.
    "pyjwt[crypto]>=2.9",
    "cryptography>=43.0",
    # Face detection (YuNet) and recognition (SFace) both live in mainline
    # OpenCV's objdetect module, so opencv-contrib is no longer needed - it
    # was only there for the LBPH recognizer.
    "opencv-python-headless>=4.10",
    "numpy>=2.0",
    "aiosmtplib>=3.0",
    "structlog>=24.4",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fzip_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
