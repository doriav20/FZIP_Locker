line-length = 100
target-version = "py313"

[lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "A",      # flake8-builtins
    "C4",     # flake8-comprehensions
    "DTZ",    # flake8-datetimez  (naive datetimes were a real bug in the 2022 code)
    "T20",    # flake8-print
    "PT",     # flake8-pytest-style
    "RET",    # flake8-return
    "SIM",    # flake8-simplify
    "PTH",    # flake8-use-pathlib  (replaces the old os.path + '\\' string surgery)
    "S",      # flake8-bandit
    "RUF",
]
ignore = [
    "S101",   # assert - used heavily and legitimately in tests
]

[lint.per-file-ignores]
# Tests may hardcode passwords and use subprocess freely.
"**/tests/**" = ["S105", "S106", "S108", "S311"]
# CLI scripts print progress by design - that is their entire output.
"server/scripts/*" = ["T20"]
"scripts/*" = ["T20"]
# Qt signals must be camelCase to match the framework's own API; renaming them
# to snake_case would break the convention every Qt reader expects.
"client/src/fzip_client/ui/**" = ["N815"]

[lint.isort]
known-first-party = ["fzip_server", "fzip_client"]
