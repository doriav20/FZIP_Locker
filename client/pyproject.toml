[project]
name = "fzip-client"
version = "2.0.0"
description = "FZIP Locker desktop client - zero-knowledge file vault with face-gated access"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }

dependencies = [
    # Crypto core. `cryptography` provides AES-GCM; argon2-cffi provides the
    # Argon2id KDF. Together these replace the 2022 pycryptodome AES-OFB code,
    # which had no authentication and used a repo-committed static key.
    "cryptography>=43.0",
    "argon2-cffi>=23.1",
    # API transport. httpx over TLS replaces the raw-socket pickle protocol.
    "httpx>=0.27",
    # OS-native credential storage (DPAPI / Keychain / libsecret) for the
    # refresh token, replacing the module-global USER_EMAIL of the old client.
    "keyring>=25.0",
    # GUI + camera.
    "PyQt6>=6.7",
    "opencv-python>=4.10",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
]

[project.scripts]
fzip-client = "fzip_client.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fzip_client"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
