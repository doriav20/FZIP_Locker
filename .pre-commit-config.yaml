# Run once after cloning:  uv tool run pre-commit install
#
# The gitleaks hook is the important one here: the 2022 version of this
# project committed a raw AES key because nothing was watching. .gitignore
# covers the filenames we can predict; gitleaks covers the ones we can't.

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.28.0
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.2
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.18.2
    hooks:
      - id: mypy
        name: mypy (server)
        files: ^server/src/
        args: [--strict, --ignore-missing-imports]
        additional_dependencies:
          - pydantic>=2.9
          - pydantic-settings>=2.5
